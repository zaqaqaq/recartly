name: Tests with Allure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start Recartly (Docker Compose)
        run: |
          # Запускаем backend, db и redis (frontend не нужен для API-тестов)
          docker compose up -d backend db redis

      - name: Wait for app
        run: sleep 10

      - name: Run tests with Allure
        run: |
          cd backend
          # Используем порт 8000, так как бэкенд слушает его
          BASE_URL=http://localhost:8000 pytest tests/ --alluredir=allure-results -v

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip allure-2.29.0.zip -d /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        run: |
          cd backend
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure results (raw data)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: backend/allure-results

      - name: Upload Allure report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: backend/allure-report