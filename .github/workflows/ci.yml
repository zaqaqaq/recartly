name: Tests with Allure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start Recartly (Docker Compose)
        run: |
          docker compose up -d db redis
          sleep 5
          docker compose up -d backend frontend
          sleep 15

      - name: Create database tables
        run: |
          docker compose exec backend python -c "
            import sys
            sys.path.append('/app')
            from app import create_app, db
            app = create_app()
            with app.app_context():
              db.create_all()
              print('✅ Таблицы созданы')
            "
        continue-on-error: true

      - name: Wait for app
        run: sleep 5

      - name: Run tests with Allure
        run: |
          cd backend
          pytest tests/ --alluredir=allure-results -v

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip allure-2.29.0.zip -d /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        run: |
          cd backend
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure results (raw data)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: backend/allure-results

      - name: Upload Allure report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: backend/allure-report